<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe & Bakery - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <header id="site-navbar"></header>

    <main class="container my-5 pt-5">
        <div id="loginFormContainer" class="col-md-6 mx-auto">
            <div class="card ticket-card">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4 font-display text-ink" style="font-size: var(--text-xl);">Welcome Back</h2>
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label fw-bold">Email address</label>
                            <input type="email" class="form-control" id="loginEmail" required>
                        </div>
                        <div class="mb-3">
                            <label for="loginPassword" class="form-label fw-bold">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required>
                        </div>
                        <button type="submit" class="btn btn-brass w-100 py-2">Login</button>
                    </form>
                    <div id="loginMessage" class="d-none alert mt-3 text-center"></div>
                    <div class="text-center mt-4">
                        <a href="register.html" class="text-decoration-none text-brass fw-bold">Don't have an account? Register here.</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
