<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe & Bakery - Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <header id="site-navbar"></header>

    <!-- Loading State -->
    <div id="adminLoader" class="d-flex justify-content-center align-items-center" style="height: 100vh; background-color: var(--paper);">
        <div class="text-center">
            <div class="spinner-border mb-3" role="status" style="color: var(--brass); width: 3rem; height: 3rem;">
                <span class="visually-hidden">Authenticating...</span>
            </div>
            <h5 class="font-display text-ink">Verifying Admin Access...</h5>
        </div>
    </div>

    <main id="adminContent" class="container my-5 pt-5 d-none">
        <h2 class="mb-4 font-display" style="font-size: var(--text-xl);">Admin Dashboard</h2>
        <div id="dashboardStats" class="row g-4 mb-5">
            <div class="col-md-3 col-6">
                <div class="card ticket-card h-100">
                    <div class="card-body text-center p-4">
                        <h6 class="font-mono small text-uppercase text-ink opacity-75 mb-3" style="font-size: 0.75rem;">Orders Today</h6>
                        <h2 class="font-display text-brass mb-0" id="statOrdersToday">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card ticket-card h-100">
                    <div class="card-body text-center p-4">
                        <h6 class="font-mono small text-uppercase text-ink opacity-75 mb-3" style="font-size: 0.75rem;">Revenue Today</h6>
                        <h2 class="font-display text-brass mb-0" id="statRevenueToday">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card ticket-card h-100">
                    <div class="card-body text-center p-4">
                        <h6 class="font-mono small text-uppercase text-ink opacity-75 mb-3" style="font-size: 0.75rem;">Pending Orders</h6>
                        <h2 class="font-display text-brass mb-0" id="statPendingOrders">-</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-3 col-6">
                <div class="card ticket-card h-100">
                    <div class="card-body text-center p-4">
                        <h6 class="font-mono small text-uppercase text-ink opacity-75 mb-3" style="font-size: 0.75rem;">Menu Items</h6>
                        <h2 class="font-display text-brass mb-0" id="statMenuCount">-</h2>
                    </div>
                </div>
            </div>
        </div>

        <div id="ordersDashboard" class="mb-5 table-responsive">
            <!-- Orders table will go here -->
        </div>

        <div id="menuManagement" class="mb-5">
            <h3 class="mb-4 font-display text-ink" style="font-size: var(--text-lg); border-bottom: 2px solid var(--brass); padding-bottom: 10px; display: inline-block;">Menu Management</h3>
            <div class="row g-4">
                <!-- Form Column -->
                <div class="col-lg-4">
                    <div class="card ticket-card">
                        <div class="card-body p-4">
                            <h4 class="font-display mb-4 text-ink" id="menuFormTitle" style="font-size: var(--text-md);">Add New Item</h4>
                            <form id="menuForm">
                                <input type="hidden" id="menuItemId">
                                <div class="mb-3">
                                    <label class="form-label fw-bold font-mono small text-uppercase">Name</label>
                                    <input type="text" class="form-control" id="menuItemName" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold font-mono small text-uppercase">Description</label>
                                    <textarea class="form-control" id="menuItemDesc" rows="3"></textarea>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold font-mono small text-uppercase">Price (Rs.)</label>
                                    <input type="number" step="0.01" class="form-control" id="menuItemPrice" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold font-mono small text-uppercase">Category</label>
                                    <input type="text" class="form-control" id="menuItemCategory" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold font-mono small text-uppercase">Image URL</label>
                                    <input type="url" class="form-control" id="menuItemImage" required>
                                </div>
                                <div class="mb-4 form-check">
                                    <input type="checkbox" class="form-check-input" id="menuItemAvailable" checked>
                                    <label class="form-check-label fw-bold font-body" for="menuItemAvailable">Available</label>
                                </div>
                                <button type="submit" class="btn btn-brass w-100 py-2">Save Item</button>
                                <button type="button" class="btn btn-outline-ink w-100 py-2 mt-2 d-none" id="menuFormCancel">Cancel Edit</button>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- Table Column -->
                <div class="col-lg-8">
                    <div class="table-responsive" id="menuItemsTableContainer">
                        <!-- Menu items table will be injected here -->
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Scripts -->
    <script src="js/supabase.js"></script>
    <script src="js/navbar.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
