<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe & Bakery - Menu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">Cafe & Bakery</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3 mb-2 mb-lg-0">
                        <button class="btn btn-outline-ink position-relative text-paper" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" style="border-color: var(--paper);">
                            Cart
                            <span id="cartCountBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                                0
                            </span>
                        </button>
                    </li>
                    <li class="nav-item auth-out"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item auth-out"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item auth-in d-none"><a class="nav-link" href="admin.html">Admin</a></li>
                    <li class="nav-item auth-in d-none"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="bg-ink text-paper py-5 text-center d-flex flex-column justify-content-center" style="min-height: 50vh;">
        <div class="container fade-rise">
            <h1 class="font-display mb-3" style="font-size: var(--text-xxl);">The Hearth Bakery</h1>
            <p class="font-body mb-4" style="font-size: var(--text-lg); opacity: 0.9;">Freshly baked goods and artisan coffee, crafted daily.</p>
            <a href="#menuSection" class="btn btn-brass px-4 py-2" style="font-size: var(--text-md);">Explore the Menu</a>
        </div>
    </header>

    <main id="menuSection" class="container py-5">
        <div class="row mb-5 align-items-center">
            <div id="categoryFilters" class="col-md-7 d-flex flex-wrap gap-2 justify-content-md-start justify-content-center mb-3 mb-md-0">
                <!-- Filter buttons injected here -->
            </div>
            <div class="col-md-5">
                <input type="text" id="searchInput" class="form-control" placeholder="Search menu...">
            </div>
        </div>
        <div id="menuGrid" class="row g-4 mb-5">
            <!-- Menu items will be injected here -->
        </div>
        
        <!-- My Orders section (only visible when logged in) -->
        <div class="mt-5 pt-5 auth-in d-none" style="border-top: 1px dashed rgba(43, 27, 18, 0.2);">
            <h2 class="mb-4 font-display" style="font-size: var(--text-xl);">My Orders</h2>
            <div id="myOrders" class="row g-4">
                <!-- Orders will be injected here -->
            </div>
        </div>
    </main>

    <!-- Cart Offcanvas -->
    <div class="offcanvas offcanvas-end bg-surface" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel">
        <div class="offcanvas-header" style="border-bottom: 1px dashed rgba(43, 27, 18, 0.2);">
            <h5 class="offcanvas-title font-display" id="cartOffcanvasLabel" style="font-size: var(--text-lg);">Your Ticket</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column font-body">
            <div id="cartItemsContainer" class="flex-grow-1 overflow-auto">
                <!-- Cart items injected here -->
            </div>
            <div class="mt-3 receipt-total">
                <div class="d-flex justify-content-between mb-4">
                    <span class="font-display" style="font-size: var(--text-lg);">Total</span>
                    <span id="cartTotal" class="font-mono text-brass" style="font-size: var(--text-lg);">Rs. 0.00</span>
                </div>
                <button class="btn btn-brass w-100 py-3" id="checkoutBtn" onclick="placeOrder()" style="font-size: var(--text-md);">
                    Confirm Order
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Scripts -->
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/orders.js"></script>
</body>

</html>
