<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe & Bakery - Menu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">Cafe & Bakery</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item me-3 mb-2 mb-lg-0">
                        <button class="btn btn-outline-light position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" style="color: var(--secondary-color); border-color: var(--secondary-color);">
                            Cart
                            <span id="cartCountBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger d-none">
                                0
                            </span>
                        </button>
                    </li>
                    <li class="nav-item auth-out"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item auth-out"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item auth-in d-none"><a class="nav-link" href="admin.html">Admin</a></li>
                    <li class="nav-item auth-in d-none"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row mb-4">
            <div class="col-md-7 mb-3 mb-md-0" id="categoryFilters">
                <!-- Category buttons injected here -->
            </div>
            <div class="col-md-5">
                <input type="text" id="searchInput" class="form-control border-0 shadow-sm" placeholder="Search menu..." style="background-color: var(--secondary-color); color: var(--primary-color);">
            </div>
        </div>
        <div id="menuGrid" class="row g-4">
            <!-- Menu items will be injected here -->
        </div>
    </main>

    <!-- Cart Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartOffcanvasLabel" style="background-color: var(--secondary-color);">
        <div class="offcanvas-header" style="border-bottom: 1px solid rgba(111, 78, 55, 0.2);">
            <h5 class="offcanvas-title fw-bold" id="cartOffcanvasLabel" style="color: var(--primary-color);">Your Cart</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <div id="cartItemsContainer" class="flex-grow-1 overflow-auto">
                <!-- Cart items injected here -->
            </div>
            <div class="mt-3 pt-3" style="border-top: 1px solid rgba(111, 78, 55, 0.2);">
                <div class="d-flex justify-content-between fw-bold mb-3" style="color: var(--primary-color); font-size: 1.2rem;">
                    <span>Total:</span>
                    <span id="cartTotal">Rs. 0.00</span>
                </div>
                <button class="btn w-100 fw-bold py-2" id="checkoutBtn" style="background-color: var(--primary-color); color: var(--secondary-color);" onclick="window.location.href='#'">
                    Proceed to Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Scripts -->
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/orders.js"></script>
</body>

</html>
