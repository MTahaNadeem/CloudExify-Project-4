<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafe & Bakery - Menu</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="css/style.css" rel="stylesheet">
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container">
            <a class="navbar-brand" href="index.html">Cafe & Bakery</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item auth-out"><a class="nav-link" href="login.html">Login</a></li>
                    <li class="nav-item auth-out"><a class="nav-link" href="register.html">Register</a></li>
                    <li class="nav-item auth-in d-none"><a class="nav-link" href="admin.html">Admin</a></li>
                    <li class="nav-item auth-in d-none"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row mb-4">
            <div class="col-md-7 mb-3 mb-md-0" id="categoryFilters">
                <!-- Category buttons injected here -->
            </div>
            <div class="col-md-5">
                <input type="text" id="searchInput" class="form-control border-0 shadow-sm" placeholder="Search menu..." style="background-color: var(--secondary-color); color: var(--primary-color);">
            </div>
        </div>
        <div id="menuGrid" class="row g-4">
            <!-- Menu items will be injected here -->
        </div>
    </main>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Scripts -->
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/menu.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/orders.js"></script>
</body>

</html>
